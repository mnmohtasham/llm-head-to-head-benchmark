# Model Duel in Docker, on Linux, macOS or Windows.
#
#   Start:   docker compose up -d --build
#   Open:    http://localhost:3000
#   Logs:    docker compose logs -f
#   Stop:    docker compose down        (your machines and results stay in the volume)
#
# Every setting is below. Change one, then run docker compose up -d again.
name: llm-h2h

services:
  llm-h2h:
    build: .
    image: llm-h2h:local
    container_name: llm-h2h
    restart: unless-stopped
    init: true
    ports:
      # <address on this computer>:<port on this computer>:<PORT below>
      # 127.0.0.1 in front: only this computer can open the page. To open it from other devices on
      # your network, use "3000:3000" instead. The app has no login, so do that only on a network
      # you trust. For another port on this computer, change the middle number.
      - '127.0.0.1:3000:3000'
    extra_hosts:
      # Unsloth or LM Studio on this same computer is host.docker.internal inside the container,
      # because localhost there is the container itself. Docker Desktop has this name already;
      # this line adds it on Linux.
      - 'host.docker.internal:host-gateway'
    environment:
      # The port the app listens on inside the container. Keep it the same as the last number in
      # the ports line.
      PORT: '3000'
      # The address the app binds inside the container. 0.0.0.0 lets the ports line reach it; who
      # can open the page is decided by the ports line, not by this.
      HOST: '0.0.0.0'
      # Where machines, API keys, probes, races, results and the signing key are kept. It is the
      # llm-h2h-data volume below, so it survives rebuilds and docker compose down.
      DUEL_DATA_DIR: '/app/data'
      # The built page the app serves. Part of the image; change it only for a page of your own.
      DUEL_CLIENT_DIR: '/app/client/dist'
      # A password asked for before anything else, at least 8 characters. Set one before opening
      # the page to your network in the ports line; empty leaves the app open to whoever reaches it.
      DUEL_PASSWORD: ''
      # Or a file in the container that holds the password, for example a Docker secret mounted at
      # /run/secrets/llm-h2h-password. It wins over DUEL_PASSWORD.
      DUEL_PASSWORD_FILE: ''
      # Host names, besides localhost and IP addresses, that the page may be opened at, comma
      # separated, for example "my-pc.local,duel.home.arpa". Other names are refused, which
      # protects the app from DNS rebinding.
      DUEL_ALLOW_HOSTS: ''
      # How much the app logs: fatal, error, warn, info, debug or trace.
      LOG_LEVEL: 'warn'
      # How long, in milliseconds, the live hardware panel samples idle machines before and after
      # a race, as the baseline for its energy and temperature figures.
      DUEL_TELEMETRY_BASELINE_MS: '5000'
      # Tells the app it runs in a container, for its startup message.
      DUEL_IN_CONTAINER: '1'
      NODE_ENV: 'production'
    volumes:
      - llm-h2h-data:/app/data
    # Hardening: the app needs no Linux capabilities, writes only to its data volume, and never
    # needs more than a few hundred processes and threads. Logs are rotated.
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 512
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  llm-h2h-data:
